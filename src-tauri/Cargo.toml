[package]
name = "atlas-launcher"
version = "1.0.0"
description = "Atlas Launcher - Universal Game Library Consolidator"
authors = ["Atlas Launcher Team"]
edition = "2021"

[dependencies]
# Tauri framework
tauri = { version = "2", features = ["tracing", "protocol-asset"] }
tauri-build = { version = "2", optional = true }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database: SQLite3 + SQLx
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "migrate", "chrono"] }

# HTTP client for metadata APIs (IGDB, SteamGridDB)
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID
uuid = { version = "1", features = ["v4", "v5"] }

# Windows registry access (Steam / GOG detection)
winreg = "0.50"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
toml = "0.8"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"

[[bin]]
name = "atlas-launcher"
path = "src/main.rs"
